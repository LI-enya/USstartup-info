<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创业信息雷达 | Startup Info Radar</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
</head>
<body>
  <!-- Top Navigation -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="#" class="logo" data-i18n="logo">创业信息雷达</a>
      <div class="nav-links">
        <a href="#/us" class="nav-link" data-page="us" data-i18n="nav_us">北美市场</a>
        <a href="#/jp" class="nav-link" data-page="jp" data-i18n="nav_jp">日本市场</a>
        <a href="#/favorites" class="nav-link" data-page="favorites" data-i18n="nav_fav">我的收藏</a>
      </div>
    </div>
    <div class="nav-right">
      <button class="lang-toggle" id="langToggle" title="切换语言">
        <span class="lang-label" data-i18n="lang_toggle">显示原文</span>
      </button>
    </div>
  </nav>

  <!-- Filter Bar -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-left">
      <div class="tab-group" id="sectionTabs">
        <!-- Tabs rendered by JS -->
      </div>
    </div>
    <div class="filter-right">
      <button class="btn-small btn-outline date-toggle-btn" id="dateToggleBtn" data-i18n="filter_date_toggle">日期筛选</button>
      <div class="date-filter" id="dateFilterPanel">
        <input type="date" id="dateFrom" class="date-input">
        <span>—</span>
        <input type="date" id="dateTo" class="date-input">
        <button class="btn-small" id="applyDateFilter" data-i18n="filter_apply">应用</button>
        <button class="btn-small btn-outline" id="clearDateFilter" data-i18n="filter_clear">清除</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索..." data-i18n-placeholder="search_placeholder">
        <span class="search-icon">🔍</span>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="main-content" id="mainContent">
    <!-- Content rendered by JS -->
  </main>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" title="回到顶部">↑</button>

  <!-- Footer -->
  <footer class="footer">
    <p data-i18n="footer_text">创业信息雷达 - 每日更新的创业生态信息聚合平台</p>
    <p class="footer-note" id="lastUpdated"></p>
    <p class="footer-note" data-i18n="footer_note">数据仅供参考，不构成投资建议</p>
  </footer>

  <script src="js/i18n.js?v=4"></script>
  <script src="js/favorites.js?v=2"></script>
  <script src="js/filter.js?v=3"></script>
  <script src="js/components.js?v=4"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
